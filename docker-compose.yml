services:
  # ==============================================================================
  # PostgreSQL 16 Database Service
  # Memory-tuned for resource stability with persistent Docker volume
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: paper_trading_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=50
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c synchronous_commit=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-paper_trading_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trading_network

  # ==============================================================================
  # FastAPI Quantitative Backend Service
  # Runs under non-root appuser (UID 10001)
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: paper_trading_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trading_network

  # ==============================================================================
  # Streamlit Trading Dashboard Service
  # Runs under non-root streamlituser (UID 10002)
  # ==============================================================================
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: paper_trading_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trading_network

volumes:
  postgres_data:
    name: paper_trading_postgres_data

networks:
  trading_network:
    name: paper_trading_network
    driver: bridge
